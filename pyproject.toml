[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "mcp-edge-vision-forge"
version = "0.1.0"
description = "MCP server and MLOps CLI for compressing, quantizing, auditing and benchmarking edge computer-vision models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eduardo Pablo Lopez Sanchez" }]
keywords = [
    "mcp",
    "model-context-protocol",
    "mlops",
    "onnx",
    "quantization",
    "edge-ai",
    "computer-vision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "numpy>=1.26",
    "onnx>=1.16",
    "onnxconverter-common>=1.14",
    "onnxruntime>=1.18",
    "psutil>=5.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rich>=13.7",
    "torch>=2.2",
    "typer>=0.12",
]

[project.optional-dependencies]
simplify = ["onnxsim>=0.4.36"]
dev = [
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "onnxsim>=0.4.36",
]

[project.scripts]
edge-forge = "edge_forge.cli.main:app"
edge-forge-mcp = "edge_forge.mcp_server.server:main"

[project.urls]
Homepage = "https://github.com/eduplopez/mcp-edge-vision-forge"
Repository = "https://github.com/eduplopez/mcp-edge-vision-forge"
Issues = "https://github.com/eduplopez/mcp-edge-vision-forge/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_forge"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "pyproject.toml", "Dockerfile", "Makefile"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "slow: marks tests that exercise full export and quantization pipelines",
]

[tool.coverage.run]
source = ["edge_forge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "if TYPE_CHECKING:",
    "raise AssertionError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["edge_forge"]
strict = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "onnx.*",
    "onnxruntime.*",
    "onnxconverter_common.*",
    "onnxsim.*",
    "psutil.*",
    "torch.*",
]
ignore_missing_imports = true
